<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flavor Card - Green Apple</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #111;
    }
    .card {
      position: relative;
      width: 100vw;
      height: 100vh;
      border: 6px solid #0072ff;
      border-radius: 15px;
      overflow: hidden;
      background: linear-gradient(120deg, #a8e063, #56ab2f); /* Green Apple gradient */
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card h1 {
      position: absolute;
      font-size: 40px;
      font-weight: bold;
      color: white;
      letter-spacing: 2px;
      text-align: center;
      z-index: 1;
    }
    .card img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>GREEN APPLE</h1>
    <img src="https://pngimg.com/uploads/donut/donut_PNG47.png" alt="Green Apple Donut">
  </div>
    <!-- GSAP & Draggable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Draggable.min.js"></script>
 <script>
    const screen = document.querySelector(".card");

screen.addEventListener("drag",(e) => {
    gsap.to("h1",{
    x:1600,
    rotate:400,
    delay:1,
    duration:4,
    borderRadius:"50%",
    backgroundColor:"yellow",
   opacity:0.2,
    repeat:2,  //repeat to time//
     yoyo:true,  //move forward and backward direction

},"aashu");

    gsap.to(".card",{
     delay:1,
    duration:4,
    borderRadius:"50%",
    backgroundColor:"linear-gradient(120deg, #a8e003, #56ac2f)",
  

  
  scale:-1.5,
},"aashu");
   
});
 </script>
</body>
</html>
